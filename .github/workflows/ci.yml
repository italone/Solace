name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release readiness
        run: pnpm release:readiness

      - name: Public contract
        run: pnpm release:contract:check

      - name: 1.0 evidence checklist report
        run: pnpm release:one-zero:check -- --report

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck JSX dev runtime
        run: pnpm typecheck:jsxdev

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Package exports
        run: pnpm test:package

      - name: Coverage
        run: pnpm test:coverage

      - name: Package consumer smoke
        run: pnpm package:smoke

      - name: Adoption consumer smoke
        run: pnpm adoption:smoke

      - name: Stable app packed consumer
        run: pnpm stable:app

      - name: Benchmark smoke
        run: pnpm benchmark

  browser:
    needs: quality
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package DevTools extension smoke
        run: pnpm package:devtools-extension:smoke

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Browser benchmark
        run: pnpm benchmark:browser

      - name: E2E
        run: pnpm test:e2e

      - name: DevTools extension E2E
        run: pnpm test:e2e:devtools-extension

  performance-comparison:
    needs: quality
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Compare base and candidate performance
        run: pnpm performance:compare:ci
        env:
          SOLACE_PERFORMANCE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          SOLACE_PERFORMANCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Upload performance comparison diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-cross-commit-${{ github.run_id }}
          path: .performance-artifacts/
          if-no-files-found: warn
